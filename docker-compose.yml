# Local development stack: API + SQL Server 2022.
# All credentials below are LOCAL-ONLY examples. In Azure, use Managed Identity / Key Vault instead.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Database__Provider: "SqlServer"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AssetManagement;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      # Local-only key. Production keys come from Azure Key Vault.
      Jwt__SigningKey: "local-docker-signing-key-change-me-0123456789abcdef"
      Swagger__Enabled: "true"
      Seed__AdminEmail: "admin@example.com"
      Seed__AdminPassword: "DevOnly-Passw0rd!"
      Seed__SampleData: "true"

volumes:
  sqlserver-data:
